  <!-- arrows CSV -> Bronze -->
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <g stroke="#374151" stroke-width="2" marker-end="url(#a)">
    <line x1="270" y1="158" x2="328" y2="158"/><line x1="270" y1="208" x2="328" y2="208"/><line x1="270" y1="258" x2="328" y2="258"/>
