  <!-- Bronze tables -->
  <g font-size="14" fill="#111827">
    <rect x="330" y="138" width="290" height="40" rx="6" fill="#ffedd5" stroke="#c2410c"/><text x="345" y="163">bronze.crm_cust_info</text>
    <rect x="330" y="188" width="290" height="40" rx="6" fill="#ffedd5" stroke="#c2410c"/><text x="345" y="213">bronze.crm_prd_info</text>
    <rect x="330" y="238" width="290" height="40" rx="6" fill="#ffedd5" stroke="#c2410c"/><text x="345" y="263">bronze.crm_sales_details</text>
    <rect x="330" y="318" width="290" height="40" rx="6" fill="#ffedd5" stroke="#c2410c"/><text x="345" y="343">bronze.erp_cust_az12</text>
