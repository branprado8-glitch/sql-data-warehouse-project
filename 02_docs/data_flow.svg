  <!-- Silver / Gold placeholders -->
  <rect x="680" y="138" width="190" height="320" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="6 4"/>
  <text x="775" y="290" text-anchor="middle" font-size="15" fill="#374151">Siguiente etapa</text>
