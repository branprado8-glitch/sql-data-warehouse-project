  <rect x="900" y="138" width="180" height="320" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-dasharray="6 4"/>
  <text x="990" y="290" text-anchor="middle" font-size="15" fill="#374151">Siguiente etapa</text>
  <text x="990" y="312" text-anchor="middle" font-size="13" fill="#6b7280">dim_ / fact_ (estrella)</text>

  <!-- footer: load method -->
  <text x="475" y="488" text-anchor="middle" font-size="13" fill="#374151">CALL bronze.load_bronze()</text>
  <text x="475" y="506" text-anchor="middle" font-size="12" fill="#6b7280">COPY · carga completa (Truncate &amp; Insert) · sin transformaciones</text>
  <text x="775" y="488" text-anchor="middle" font-size="13" fill="#6b7280">silver.load_silver()</text>
  <text x="990" y="488" text-anchor="middle" font-size="13" fill="#6b7280">CREATE VIEW gold.*</text>
