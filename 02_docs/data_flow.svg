  </g>
  <text x="30" y="308" font-size="14" font-weight="bold" fill="#a16207">ERP · 01_datasets/source_erp</text>
  <g font-size="14" fill="#111827">
    <rect x="20" y="318" width="250" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/><text x="35" y="343">CUST_AZ12.csv</text>
    <rect x="20" y="368" width="250" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/><text x="35" y="393">LOC_A101.csv</text>
    <rect x="20" y="418" width="250" height="40" rx="6" fill="#fef3c7" stroke="#a16207"/><text x="35" y="443">PX_CAT_G1V2.csv</text>
