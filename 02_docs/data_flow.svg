    <rect x="20" y="138" width="250" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/><text x="35" y="163">cust_info.csv</text>
    <rect x="20" y="188" width="250" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/><text x="35" y="213">prd_info.csv</text>
