<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">Flujo de datos · sql-data-warehouse-project (PostgreSQL)</text>

  <!-- Column headers -->
  <rect x="20"  y="56" width="250" height="44" rx="8" fill="#1e3a8a"/>
